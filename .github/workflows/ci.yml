name: CI — Pipeline Multinivel TicketRush

on:
  push:
    branches: [develop, main, "feature/**", "fix/**"]
  pull_request:
    branches: [develop, main]

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# ──────────────────────────────────────────────
# JOB 1 — BUILD: Restaura y compila todos los servicios
# ──────────────────────────────────────────────
jobs:
  build:
    name: "🔨 Build — Todos los servicios"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore CrudService
        run: dotnet restore crud_service/src/CrudService.Api/CrudService.Api.csproj

      - name: Restore Producer
        run: dotnet restore producer/src/Producer.Api/Producer.Api.csproj

      - name: Restore ReservationService
        run: dotnet restore ReservationService/src/ReservationService.Worker/ReservationService.Worker.csproj

      - name: Restore PaymentService
        run: dotnet restore paymentService/src/MsPaymentService.Worker/MsPaymentService.Worker.csproj

      - name: Restore AuthService
        run: dotnet restore authService/src/AuthService.Api/AuthService.Api.csproj

      - name: Build CrudService
        run: dotnet build crud_service/src/CrudService.Api/CrudService.Api.csproj --no-restore -c Release

      - name: Build Producer
        run: dotnet build producer/src/Producer.Api/Producer.Api.csproj --no-restore -c Release

      - name: Build ReservationService
        run: dotnet build ReservationService/src/ReservationService.Worker/ReservationService.Worker.csproj --no-restore -c Release

      - name: Build PaymentService
        run: dotnet build paymentService/src/MsPaymentService.Worker/MsPaymentService.Worker.csproj --no-restore -c Release

      - name: Build AuthService
        run: dotnet build authService/src/AuthService.Api/AuthService.Api.csproj --no-restore -c Release

  # ──────────────────────────────────────────────
  # JOB 2 — UNIT TESTS: Pruebas de Caja Blanca (lógica de dominio/aplicación)
  # ──────────────────────────────────────────────
  test-unit:
    name: "🧪 Unit Tests — Caja Blanca"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Unit Tests — ReservationService
        run: |
          dotnet test ReservationService/tests/ReservationService.Application.Tests/ReservationService.Application.Tests.csproj \
            --logger "trx;LogFileName=unit-reservation.trx" \
            --results-directory ./test-results/unit \
            -c Release

      - name: Run Unit Tests — Producer
        run: |
          dotnet test producer/tests/Producer.Application.Tests/Producer.Application.Tests.csproj \
            --logger "trx;LogFileName=unit-producer.trx" \
            --results-directory ./test-results/unit \
            -c Release

      - name: Run Unit Tests — PaymentService
        run: |
          dotnet test paymentService/tests/MsPaymentService.Application.Tests/MsPaymentService.Application.Tests.csproj \
            --logger "trx;LogFileName=unit-payment.trx" \
            --results-directory ./test-results/unit \
            -c Release

      - name: Run Unit Tests — CrudService Application
        run: |
          dotnet test crud_service/tests/CrudService.Application.Tests/CrudService.Application.Tests.csproj \
            --logger "trx;LogFileName=unit-crud-app.trx" \
            --results-directory ./test-results/unit \
            -c Release

      - name: Run Unit Tests — ReservationService Domain
        run: |
          dotnet test ReservationService/tests/ReservationService.Domain.Tests/ReservationService.Domain.Tests.csproj \
            --logger "trx;LogFileName=unit-reservation-domain.trx" \
            --results-directory ./test-results/unit \
            -c Release

      - name: Run Unit Tests — AuthService Application
        run: |
          dotnet test authService/tests/AuthService.Application.Tests/AuthService.Application.Tests.csproj \
            --logger "trx;LogFileName=unit-authservice-app.trx" \
            --results-directory ./test-results/unit \
            -c Release

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results/unit/

  # ──────────────────────────────────────────────
  # JOB 3 — COMPONENT TESTS: Pruebas de componente (integración interna sin infraestructura real)
  # ──────────────────────────────────────────────
  test-component:
    name: "🔗 Component Tests — Integración Interna"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Component Tests — CrudService Infrastructure
        run: |
          dotnet test crud_service/tests/CrudService.Infrastructure.Tests/CrudService.Infrastructure.Tests.csproj \
            --filter "Category=Component" \
            --logger "trx;LogFileName=component-crud.trx" \
            --results-directory ./test-results/component \
            -c Release

      - name: Upload Component Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-results
          path: ./test-results/component/

  # ──────────────────────────────────────────────
  # JOB 4 — INTEGRATION TESTS: Pruebas de integración (contratos entre servicios)
  # ──────────────────────────────────────────────
  test-integration:
    name: "🌐 Integration Tests — Contratos entre Servicios"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Integration Tests — CrudService SSE Contract
        run: |
          dotnet test crud_service/tests/CrudService.Infrastructure.Tests/CrudService.Infrastructure.Tests.csproj \
            --filter "Category=Integration" \
            --logger "trx;LogFileName=integration-crud-sse.trx" \
            --results-directory ./test-results/integration \
            -c Release

      - name: Run Integration Tests — ReservationService Infrastructure
        run: |
          dotnet test ReservationService/tests/ReservationService.Infrastructure.Tests/ReservationService.Infrastructure.Tests.csproj \
            --logger "trx;LogFileName=integration-reservation.trx" \
            --results-directory ./test-results/integration \
            -c Release

      - name: Run Integration Tests — AuthService Infrastructure
        run: |
          dotnet test authService/tests/AuthService.Infrastructure.Tests/AuthService.Infrastructure.Tests.csproj \
            --logger "trx;LogFileName=integration-authservice.trx" \
            --results-directory ./test-results/integration \
            -c Release

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results/integration/

  # ──────────────────────────────────────────────
  # JOB 5 — BLACK-BOX TESTS: Pruebas de Caja Negra (API real sin conocimiento interno)
  # ──────────────────────────────────────────────
  test-blackbox:
    name: "📦 Black-Box Tests — API HTTP Real"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Black-Box Tests — CrudService API
        run: |
          dotnet test crud_service/tests/CrudService.Api.Tests/CrudService.Api.Tests.csproj \
            --filter "Category=BlackBox" \
            --logger "trx;LogFileName=blackbox-crud-api.trx" \
            --results-directory ./test-results/blackbox \
            -c Release

      - name: Upload Black-Box Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-test-results
          path: ./test-results/blackbox/

  # ──────────────────────────────────────────────
  # JOB 6 — DOCKER BUILD + TRIVY SCAN: Construcción segura e inspección de vulnerabilidades
  # ──────────────────────────────────────────────
  docker-security:
    name: "🐳 Docker Build & Trivy Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: [test-unit, test-component, test-integration, test-blackbox]
    strategy:
      matrix:
        service:
          - name: crud-service
            context: ./crud_service
            dockerfile: ./crud_service/Dockerfile
          - name: producer
            context: ./producer
            dockerfile: ./producer/Dockerfile
          - name: payment-service
            context: ./paymentService
            dockerfile: ./paymentService/Dockerfile
          - name: reservation-service
            context: ./ReservationService
            dockerfile: ./ReservationService/Dockerfile
          - name: auth-service
            context: ./authService
            dockerfile: ./authService/src/AuthService.Api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image — ${{ matrix.service.name }}
        run: |
          docker build \
            -f ${{ matrix.service.dockerfile }} \
            -t ticketrush/${{ matrix.service.name }}:${{ github.sha }} \
            ${{ matrix.service.context }}

      - name: Run Trivy vulnerability scanner — ${{ matrix.service.name }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ticketrush/${{ matrix.service.name }}:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          output: "trivy-${{ matrix.service.name }}.txt"

      - name: Upload Trivy report — ${{ matrix.service.name }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.service.name }}
          path: trivy-${{ matrix.service.name }}.txt
